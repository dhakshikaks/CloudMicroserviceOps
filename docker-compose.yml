name: cloud-microservices-ops

x-service-env: &service-env
  DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cloudops}
  DB_USERNAME: ${POSTGRES_USER:-cloudops}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  # ---------------- Infrastructure ----------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudops}
      POSTGRES_USER: ${POSTGRES_USER:-cloudops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: cloudopskafkacluster01

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # ---------------- Backend ----------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *service-env
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  # ---------------- Business microservices ----------------
  # Call chain: user-service -> order-service -> payment-service -> inventory-service
  inventory-service:
    build:
      context: .
      dockerfile: microservices/inventory-service/Dockerfile
    environment:
      <<: *service-env
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  payment-service:
    build:
      context: .
      dockerfile: microservices/payment-service/Dockerfile
    environment:
      <<: *service-env
      INVENTORY_SERVICE_URL: http://inventory-service:8084
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      inventory-service:
        condition: service_started

  order-service:
    build:
      context: .
      dockerfile: microservices/order-service/Dockerfile
    environment:
      <<: *service-env
      PAYMENT_SERVICE_URL: http://payment-service:8083
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      payment-service:
        condition: service_started

  user-service:
    build:
      context: .
      dockerfile: microservices/user-service/Dockerfile
    environment:
      <<: *service-env
      ORDER_SERVICE_URL: http://order-service:8082
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      order-service:
        condition: service_started

  # ---------------- Frontend ----------------
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      VITE_PROMETHEUS_URL: http://localhost:9090
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  grafana-data:
