name: cloud-microservices-ops

x-service-env: &service-env
  DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cloudops}
  DB_USERNAME: ${POSTGRES_USER:-cloudops}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-32-bytes-min}

x-restart-policy: &restart-policy unless-stopped

services:
  # ---------------- Infrastructure (internal only - no host ports) ----------------
  postgres:
    image: postgres:16-alpine
    restart: *restart-policy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudops}
      POSTGRES_USER: ${POSTGRES_USER:-cloudops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    restart: *restart-policy
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: cloudopskafkacluster01

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: *restart-policy
    ports:
      # Published so `npm run dev` (Vite, outside Docker) can reach it at the
      # same localhost:9090 its dev proxy already assumes - see frontend/vite.config.ts.
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    restart: *restart-policy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # ---------------- Backend (internal - reached via the frontend's /api proxy) ----------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: *restart-policy
    ports:
      # Published so `npm run dev` (Vite, outside Docker) can reach it at the
      # same localhost:8080 its dev proxy already assumes - see frontend/vite.config.ts.
      - "127.0.0.1:8080:8080"
    environment:
      <<: *service-env
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  # ---------------- Business microservices (internal only) ----------------
  # Call chain: user-service -> order-service -> payment-service -> inventory-service
  inventory-service:
    build:
      context: .
      dockerfile: microservices/inventory-service/Dockerfile
    restart: *restart-policy
    environment:
      <<: *service-env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  payment-service:
    build:
      context: .
      dockerfile: microservices/payment-service/Dockerfile
    restart: *restart-policy
    environment:
      <<: *service-env
      INVENTORY_SERVICE_URL: http://inventory-service:8084
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      inventory-service:
        condition: service_started

  order-service:
    build:
      context: .
      dockerfile: microservices/order-service/Dockerfile
    restart: *restart-policy
    environment:
      <<: *service-env
      PAYMENT_SERVICE_URL: http://payment-service:8083
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      payment-service:
        condition: service_started

  user-service:
    build:
      context: .
      dockerfile: microservices/user-service/Dockerfile
    restart: *restart-policy
    environment:
      <<: *service-env
      ORDER_SERVICE_URL: http://order-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      order-service:
        condition: service_started

  # ---------------- Frontend (the only public entry point) ----------------
  frontend:
    build:
      context: ./frontend
      args:
        # Build-time only (Vite inlines this) - a relative path routes through
        # this same container's own Nginx proxy, so it works unchanged for
        # both local Docker Compose and a single-host cloud deployment. The
        # frontend no longer talks to Prometheus directly - that is now
        # aggregated by the Java backend (com.cloudmicroops.metrics) and
        # served under this same /api path.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: *restart-policy
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  grafana-data:
