server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend keeps its own "/api" prefix in its routes, so the matched
    # location is NOT stripped from the proxied request (no URI after the
    # upstream address below). BACKEND_HOSTPORT is filled in at container
    # start by the nginx image's envsubst templating (see Dockerfile).
    location /api/ {
        proxy_pass http://${BACKEND_HOSTPORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
